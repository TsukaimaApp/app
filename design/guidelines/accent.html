<!-- @dsCard group="Colors" viewport="700x170" name="Accent — lavender" subtitle="Mid-depth mauve; tints for selection only" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"><style>body{margin:0;font:var(--type-caption);color:var(--text-secondary);background:var(--surface-page)}.row{display:flex;gap:12px;padding:16px 16px 6px}.sw{flex:1;height:72px;border-radius:12px;border:1px solid var(--border-hairline);padding:10px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:flex-end}.n{font:var(--type-ui)}.note{padding:0 18px 12px;font:var(--type-caption);color:var(--text-tertiary)}a{color:var(--accent)}a:hover{color:var(--accent-pressed)}</style></head><body>
<div class="row">
<div class="sw" style="background:var(--lavender-600);color:#fff"><span class="n">pressed</span>#6A5EBF</div>
<div class="sw" style="background:var(--lavender-500);color:#fff"><span class="n">accent</span>#7C6FCF</div>
<div class="sw" style="background:var(--lavender-300);color:var(--ink-1)"><span class="n">selected tint</span>#C9C2F0</div>
<div class="sw" style="background:var(--lavender-100);color:var(--ink-1)"><span class="n">user bubble</span>#EAE6F8</div>
</div>
<div class="note">Accent only on: send button, active states, presence dot, approval actions. Tints never set text or buttons.</div>
</body></html>
