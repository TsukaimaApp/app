<!-- @dsCard group="Colors" viewport="700x150" name="Semantic + code" subtitle="Muted status colors; warm-dark code ground" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:var(--surface-page);font:var(--type-caption);color:var(--text-secondary)}.row{display:flex;gap:12px;padding:16px}.sw{flex:1;height:84px;border-radius:12px;padding:10px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:flex-end;color:#fff}.n{font:var(--type-ui)}a{color:var(--accent)}a:hover{color:var(--accent-pressed)}</style></head><body>
<div class="row">
<div class="sw" style="background:var(--green-600)"><span class="n">ok</span>#5B8A68</div>
<div class="sw" style="background:var(--red-600)"><span class="n">danger</span>#B3564E</div>
<div class="sw" style="background:var(--amber-600)"><span class="n">waiting</span>#A8823E</div>
<div class="sw" style="background:var(--code-bg);color:var(--code-ink)"><span class="n">code bg</span>#272233</div>
</div></body></html>
