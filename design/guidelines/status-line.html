<!-- @dsCard group="Brand" viewport="700x190" name="Agent status line" subtitle="First-class element — serif line + lavender dot" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:var(--surface-page);color:var(--text-secondary);padding:18px 24px;display:flex;flex-direction:column;gap:12px}.s{display:flex;align-items:center;gap:8px;font:var(--type-status)}.d{width:7px;height:7px;border-radius:99px}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}a{color:var(--accent)}a:hover{color:var(--accent-pressed)}</style></head><body>
<div class="s"><span class="d" style="background:var(--text-tertiary)"></span>Idle</div>
<div class="s"><span class="d" style="background:var(--accent);animation:pulse 2s infinite"></span>Thinking…</div>
<div class="s"><span class="d" style="background:var(--accent);animation:pulse 2s infinite"></span>Running shell command</div>
<div class="s"><span class="d" style="background:var(--status-warn)"></span>Waiting for your approval</div>
</body></html>
