<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"><style>body{margin:0;font:var(--type-caption);color:var(--text-secondary);background:var(--surface-page)}.row{display:flex;gap:12px;padding:16px}.sw{flex:1;height:84px;border-radius:12px;border:1px solid var(--border-hairline);padding:10px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:flex-end}.n{font:var(--type-ui);color:var(--text-body)}a{color:var(--accent)}a:hover{color:var(--accent-pressed)}</style></head><body>
<div class="row">
<div class="sw" style="background:var(--cream-1)"><span class="n">page</span>#F7F4ED</div>
<div class="sw" style="background:var(--cream-0)"><span class="n">raised</span>#FFFDF7</div>
<div class="sw" style="background:var(--cream-2)"><span class="n">sunken</span>#EFEAE0</div>
<div class="sw" style="background:var(--cream-3)"><span class="n">hairline</span>#E6E0D4</div>
</div></body></html>
