<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:var(--surface-page);font:var(--type-caption);color:var(--text-secondary)}.row{display:flex;gap:12px;padding:16px}.sw{flex:1;height:84px;border-radius:12px;padding:10px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:flex-end;color:var(--night-ink-1)}.n{font:var(--type-ui)}a{color:var(--accent)}a:hover{color:var(--accent-pressed)}</style></head><body data-theme="dark">
<div class="row">
<div class="sw" style="background:var(--night-1)"><span class="n">page</span>#1B1917</div>
<div class="sw" style="background:var(--night-0)"><span class="n">raised</span>#242120</div>
<div class="sw" style="background:var(--lavender-night);color:var(--night-1)"><span class="n">accent</span>#A89CFF</div>
<div class="sw" style="background:var(--lavender-night-tint)"><span class="n">bubble / tint</span>#322E48</div>
</div></body></html>
