name: Android CI

on:
  push:
  pull_request:

permissions:
  contents: read

# One run per ref: a newer push cancels the run still going for the same branch or PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        with:
          # The default package list includes the obsolete `tools` package, which no longer installs.
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests, lint, debug and release (R8) APKs
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: tsukaima-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      # Release build type (R8 + resource shrinking). CI has no release key (it lives only in .local/), so this one is
      # signed with the debug keystore; local builds with .local/keystore.properties are release-signed.
      - uses: actions/upload-artifact@v4
        with:
          name: tsukaima-release-debugsigned
          path: app/build/outputs/apk/release/app-release.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      # Only on a failure: the per-test XML and HTML, so a CI-only failure can be read without re-running.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: |
            app/build/test-results/testDebugUnitTest
            app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore
