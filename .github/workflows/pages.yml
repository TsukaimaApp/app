name: Site

# Checks run on every branch and pull request that touches the site or its tooling; only main deploys.
on:
  push:
    paths: ['site/**', 'scripts/site/**']
  pull_request:
    paths: ['site/**', 'scripts/site/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One run per ref: deployments from main queue behind each other instead of cancelling; branch checks run independently.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Static checks (html-validate, hosts, links, copy, budgets)
        run: bash scripts/site/check.sh

  deploy:
    needs: check
    # Only main deploys: a push, or a manual run on main. Other branches and pull requests stop after the checks.
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Fails until Pages is enabled with Source: GitHub Actions (see site/README.md).
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
